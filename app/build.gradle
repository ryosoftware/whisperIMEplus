plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.whisperonnx'
    compileSdk 35


    defaultConfig {
        applicationId "org.woheller69.whisperplus"
        minSdk 28
        targetSdk 35
        versionCode 20
        versionName "2.0"

    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }

    // Removed externalNativeBuild block

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    dependenciesInfo {
        // Disable including dependency metadata when building APKs
        includeInApk = false
        // Disable including dependency metadata when building Android App Bundles
        includeInBundle = false
    }
    lint {
        disable 'MissingTranslation'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    implementation 'com.google.guava:guava:33.7.2-android'
    implementation 'com.github.gkonovalov.android-vad:webrtc:2.0.10'
    implementation 'com.github.houbb:opencc4j:1.14.0'

    //ONNX Runtime
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
    //noinspection Aligned16KB
    implementation 'com.microsoft.onnxruntime:onnxruntime-extensions-android:0.13.0'   
    implementation 'com.github.woheller69:FreeDroidWarn:+'

}
